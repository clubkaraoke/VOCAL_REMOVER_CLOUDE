<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Audio DAW - MVSep</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stem-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .stem-card:hover {
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
        }
        audio {
            width: 100%;
            height: 40px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        .project-btn {
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .project-btn:hover {
            background: rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen font-sans text-white">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Header -->
        <div class="mb-8">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-4xl font-bold mb-2">🎵 Audio DAW</h1>
                    <p class="text-gray-400">Edita y exporta con MVSep</p>
                </div>
                <button onclick="syncMVSep()" id="syncBtn" class="btn-primary text-white px-6 py-2 rounded-lg font-semibold">
                    🔄 Sincronizar
                </button>
            </div>
            <div id="statusMsg" class="text-sm text-indigo-400 mb-4 min-h-6"></div>
        </div>

        <!-- Layout -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <!-- Sidebar -->
            <div class="md:col-span-1">
                <div class="glass rounded-lg p-4 sticky top-4">
                    <h2 class="text-xl font-semibold mb-4">📁 Proyectos</h2>
                    <div id="projectsList" class="space-y-2 max-h-96 overflow-y-auto">
                        <div class="text-center text-gray-400 py-8">
                            <p class="text-sm">Cargando...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main -->
            <div class="md:col-span-3 space-y-6">
                <!-- Project Info -->
                <div id="projectInfo" class="glass rounded-lg p-6 hidden">
                    <div class="flex justify-between items-start">
                        <div>
                            <h2 id="projectTitle" class="text-2xl font-bold mb-1">--</h2>
                            <p id="projectMeta" class="text-gray-400 text-sm">--</p>
                        </div>
                        <button onclick="closeProject()" class="px-4 py-2 bg-gray-700 rounded">✕ Cerrar</button>
                    </div>
                </div>

                <!-- Stems -->
                <div id="stemsContainer" class="space-y-4 hidden">
                    <h3 class="text-lg font-semibold">🎸 Pistas</h3>
                    <div id="stemsList" class="space-y-4"></div>
                </div>

                <!-- Controls -->
                <div id="playerControls" class="glass rounded-lg p-4 hidden">
                    <div class="flex items-center gap-4 flex-wrap">
                        <button onclick="togglePlayAll()" id="playBtn" class="btn-primary text-white px-6 py-2 rounded">▶ Play</button>
                        <input type="range" id="volumeSlider" min="0" max="100" value="100" class="flex-1" onchange="setGlobalVolume(this.value)">
                    </div>
                </div>

                <!-- Export -->
                <div id="exportSection" class="glass rounded-lg p-4 hidden">
                    <div class="flex gap-4">
                        <select id="exportFormat" class="px-3 py-2 bg-gray-700 rounded text-white">
                            <option>mp3</option>
                            <option>wav</option>
                        </select>
                        <button onclick="exportMix()" class="btn-success text-white flex-1 px-4 py-2 rounded">⬇️ Descargar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CAMBIAR ESTA URL por tu servidor:
        const API_BASE = 'https://your-replit-url.replit.dev/api';
        
        let currentProject = null;
        let allAudios = [];

        async function syncMVSep() {
            const btn = document.getElementById('syncBtn');
            const status = document.getElementById('statusMsg');
            
            btn.disabled = true;
            btn.textContent = '⏳...';
            
            try {
                const response = await fetch(`${API_BASE}/sync-mvsep`, {
                    method: 'POST'
                });
                const data = await response.json();
                status.textContent = `✅ ${data.new_projects || 0} proyectos importados`;
                loadProjects();
            } catch (e) {
                status.textContent = `❌ Error: ${e.message}`;
            } finally {
                btn.disabled = false;
                btn.textContent = '🔄 Sincronizar';
            }
        }

        async function loadProjects() {
            try {
                const response = await fetch(`${API_BASE}/projects`);
                const projects = await response.json();
                renderProjectsList(projects);
            } catch (e) {
                console.error('Error:', e);
            }
        }

        function renderProjectsList(projects) {
            const list = document.getElementById('projectsList');
            list.innerHTML = '';
            
            if (projects.length === 0) {
                list.innerHTML = '<div class="text-center text-gray-400 py-8"><p class="text-sm">No hay proyectos</p></div>';
                return;
            }
            
            projects.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'project-btn w-full text-left';
                btn.textContent = `📁 ${p.title}`;
                btn.onclick = () => loadProject(p.id);
                list.appendChild(btn);
            });
        }

        async function loadProject(projectId) {
            try {
                const response = await fetch(`${API_BASE}/projects/${projectId}`);
                const project = await response.json();
                currentProject = project;
                allAudios = [];
                
                document.getElementById('projectInfo').classList.remove('hidden');
                document.getElementById('projectTitle').textContent = project.title;
                document.getElementById('projectMeta').textContent = `${project.stem_count} pistas`;
                
                renderStems(project.stems);
                
                document.getElementById('stemsContainer').classList.remove('hidden');
                document.getElementById('playerControls').classList.remove('hidden');
                document.getElementById('exportSection').classList.remove('hidden');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        function renderStems(stems) {
            const list = document.getElementById('stemsList');
            list.innerHTML = '';
            
            stems.forEach((stem, idx) => {
                const container = document.createElement('div');
                container.className = 'stem-card rounded-lg p-4';
                
                const audio = document.createElement('audio');
                audio.src = stem.url;
                audio.controls = true;
                audio.className = 'mb-2';
                
                const controls = document.createElement('div');
                controls.className = 'flex gap-2';
                controls.innerHTML = `
                    <input type="range" min="0" max="100" value="100" class="flex-1" 
                           onchange="setVolume(${idx}, this.value)">
                `;
                
                container.innerHTML = `<h4 class="font-semibold mb-2">${stem.name}</h4>`;
                container.appendChild(audio);
                container.appendChild(controls);
                list.appendChild(container);
                
                allAudios.push(audio);
            });
        }

        function setVolume(idx, value) {
            if (allAudios[idx]) allAudios[idx].volume = value / 100;
        }

        function setGlobalVolume(value) {
            allAudios.forEach(audio => audio.volume = value / 100);
        }

        function togglePlayAll() {
            const btn = document.getElementById('playBtn');
            const isPlaying = btn.textContent.includes('❚❚');
            
            allAudios.forEach(audio => {
                if (isPlaying) audio.pause();
                else audio.play();
            });
            
            btn.textContent = isPlaying ? '▶ Play' : '❚❚ Pause';
        }

        function exportMix() {
            alert('Descargando...');
        }

        function closeProject() {
            currentProject = null;
            allAudios.forEach(a => a.pause());
            document.getElementById('projectInfo').classList.add('hidden');
            document.getElementById('stemsContainer').classList.add('hidden');
            document.getElementById('playerControls').classList.add('hidden');
            document.getElementById('exportSection').classList.add('hidden');
        }

        // Cargar al iniciar
        loadProjects();
    </script>
</body>
</html>
